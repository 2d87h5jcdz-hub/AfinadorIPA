name: Afinador
options:
  bundleIdPrefix: com.afinador
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Afinador:
    type: application
    platform: iOS
    sources:
      - path: Afinador
        excludes: ["Models", "Models/**"]
      # Neural Amp Modeler (MIT) — só os .cpp entram no build; Eigen/json são só cabeçalhos (via HEADER_SEARCH_PATHS).
      - path: Vendor/NAM
        excludes: ["LICENSE"]
      # Modelo de IA já compilado (baixado no CI da release demucs-model) fica em Afinador/Models.
      # Referência de pasta: mantém a estrutura interna do .mlmodelc e vai para Models/ no bundle.
      # A pasta sempre existe (.gitkeep); sem modelo, o app sai sem o separador.
      - path: Afinador/Models
        type: folder
        buildPhase: resources
    info:
      path: Afinador/Info.plist
      properties:
        CFBundleDisplayName: Pestana
        CFBundleDevelopmentRegion: pt-BR
        CFBundleLocalizations: [pt-BR]
        CFBundleName: Pestana
        NSMicrophoneUsageDescription: O app usa o microfone para afinar o instrumento e gravar suas músicas. Nada sai do seu iPhone sem você compartilhar.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afinador.app
        SWIFT_OBJC_BRIDGING_HEADER: Afinador/Afinador-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_CXX_LIBRARY: libc++
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor", "$(SRCROOT)/Vendor/NAM", "$(SRCROOT)/Vendor/eigen", "$(SRCROOT)/Vendor/nlohmann", "$(SRCROOT)/Afinador/GuitarFX"]
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "NAM_SAMPLE_FLOAT=1", "NAM_ENABLE_A2_FAST=1"]
        # C++ do amplificador roda em tempo real: otimização máxima (o padrão do Release é -Os).
        GCC_OPTIMIZATION_LEVEL: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
