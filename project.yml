name: Afinador
options:
  bundleIdPrefix: com.afinador
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Afinador:
    type: application
    platform: iOS
    sources:
      - path: Afinador
        excludes: ["Models", "Models/**"]
      # Modelo de IA já compilado (baixado no CI da release demucs-model). Referência de pasta
      # para manter a estrutura interna do .mlmodelc no bundle; ausente = app sem separador.
      - path: Afinador/Models/HTDemucs.mlmodelc
        type: folder
        buildPhase: resources
        optional: true
    info:
      path: Afinador/Info.plist
      properties:
        CFBundleDisplayName: Afinador
        NSMicrophoneUsageDescription: O app usa o microfone para afinar o instrumento e gravar suas músicas. Nada sai do seu iPhone sem você compartilhar.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afinador.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
