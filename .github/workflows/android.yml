name: Gerar APK (Android)

on:
  push:
    branches: [android]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - name: Instalar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Testes e APK de release (assinado)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Resumo (testes e avisos do compilador)
        run: |
          T=$(grep -ho 'tests="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          echo "::notice title=Testes::$T testes de unidade passaram"
          grep '^w: ' build.log | sed -e 's#file://[^ ]*/android/##' | sort -u | head -15 > w.txt || true
          if [ -s w.txt ]; then
            echo "::warning title=Avisos do Kotlin::$(sed -e 's/%/%25/g' w.txt | awk 'BEGIN{ORS="%0A"} {print}')"
          fi

      - name: Mostrar erros de compilação
        if: failure()
        run: |
          # O GitHub aceita só 10 anotações de erro por step: agrupa várias linhas por anotação.
          enc() { sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed -e 's/\r//g'; }
          grep -E '^(e: |ERROR:|.*error: |.*FAILED$|.*AAPT: error)' build.log | sed -e 's#file://[^ ]*/android/##' | sort -u | head -60 > errors.txt || true
          # Testes que falharam
          grep -E '^\S+Test > .* FAILED' -A3 build.log >> errors.txt || true
          if [ -s errors.txt ]; then
            split -l 6 errors.txt part_
            for p in part_*; do echo "::error title=Erro de build::$(enc < "$p")"; done | head -8
          fi
          # Bloco "What went wrong" do Gradle
          awk '/What went wrong:/{f=1} /\* Try:/{f=0} f' build.log | head -40 > wrong.txt || true
          if [ -s wrong.txt ]; then echo "::error title=Gradle::$(enc < wrong.txt)"; fi

      - name: Conferir assinatura do APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          "$BT/aapt2" dump badging "$APK" | head -3 || true
          cp "$APK" "$GITHUB_WORKSPACE/PestanaEstudio.apk"
          SIZE=$(du -h "$GITHUB_WORKSPACE/PestanaEstudio.apk" | cut -f1)
          echo "::notice title=APK pronto::PestanaEstudio.apk ($SIZE) assinado — baixe o artifact PestanaEstudio-apk"

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: PestanaEstudio-apk
          path: PestanaEstudio.apk
          if-no-files-found: error
          retention-days: 90

  # Abre o APK num emulador Android, passa por todas as abas e tira prints.
  # Os prints vão para o ramo "android-capturas" (fácil de ver sem baixar nada).
  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: PestanaEstudio-apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador + teste de fumaça
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: bash android/ci/smoke.sh PestanaEstudio.apk capturas

      - name: Publicar prints no ramo android-capturas
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d capturas ] || exit 0
          cd capturas
          git init -q -b android-capturas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Prints do teste no emulador\n\nGerados pelo workflow android.yml (commit %s).\n' "$GITHUB_SHA" > README.md
          git add -A
          git commit -q -m "Prints do emulador ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" android-capturas
          echo "::notice title=Prints::Prints em https://github.com/${GITHUB_REPOSITORY}/tree/android-capturas"
