name: Gerar IPA

on:
  push:
    branches: [main, estudio]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Baixar modelo de IA (Demucs), se existir
        # Nunca falha o build: sem release/asset (ou zip inválido), o app sai sem o modelo.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          rm -rf /tmp/demucs Afinador/Models/*.mlmodelc && mkdir -p /tmp/demucs Afinador/Models
          if gh release download demucs-model -R "$GITHUB_REPOSITORY" -p '*.zip' -D /tmp/demucs 2>/dev/null; then
            mkdir -p Afinador/Models
            for z in /tmp/demucs/*.zip; do unzip -oq "$z" -d Afinador/Models || echo "zip inválido: $z"; done
            ls -la Afinador/Models
          else
            echo "sem modelo (release demucs-model não existe) — o app sai sem o separador de IA"
          fi
          exit 0

      - name: Gerar projeto Xcode
        run: |
          mkdir -p Afinador/Models
          xcodegen generate

      - name: Compilar (sem assinatura)
        run: |
          xcodebuild \
            -project Afinador.xcodeproj \
            -scheme Afinador \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Mostrar erros de compilação
        if: failure()
        run: |
          # GitHub aceita só 10 anotações de erro por step: agrupa 6 erros (com a linha do código) por anotação.
          grep -E "(error|fatal error):" build.log | grep -v "^\*\*" | sort -u | head -60 > errors.txt || true
          echo "Total de linhas de erro distintas: $(grep -cE "(error|fatal error):" build.log | head -1)"
          : > annotated.txt
          while IFS= read -r line; do
            ctx=""
            if [[ "$line" =~ ^(/[^:]+):([0-9]+):([0-9]+):\ (fatal\ )?error: ]]; then
              f="${BASH_REMATCH[1]}"; n="${BASH_REMATCH[2]}"
              ctx=$(sed -n "${n}p" "$f" 2>/dev/null | sed 's/^[[:space:]]*//' | cut -c1-160)
              line="${line#$GITHUB_WORKSPACE/}"
            fi
            echo "${line} ⟶ ${ctx}" >> annotated.txt
          done < errors.txt
          cat annotated.txt
          split -l 6 annotated.txt chunk_
          for c in chunk_*; do
            [ -f "$c" ] || continue
            msg=$(sed -e 's/%/%25/g' "$c" | awk '{printf "%s%%0A", $0}')
            echo "::error::${msg}"
          done

      - name: Mostrar avisos do código do app
        if: always()
        continue-on-error: true
        run: |
          [ -f build.log ] || exit 0
          grep -E "/Afinador/.*\.swift:[0-9]+:[0-9]+: warning:" build.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u > warnings.txt || true
          echo "Avisos distintos: $(wc -l < warnings.txt)"
          cat warnings.txt
          head -60 warnings.txt | split -l 6 - wchunk_
          for c in wchunk_*; do
            [ -f "$c" ] || continue
            msg=$(sed -e 's/%/%25/g' "$c" | awk '{printf "%s%%0A", $0}')
            echo "::warning::${msg}"
          done

      - name: Empacotar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Afinador.app Payload/
          zip -qry Afinador.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Afinador-ipa
          path: Afinador.ipa
