name: Página (GitHub Pages)

# Publica a página de divulgação (pasta site/) quando ela muda no main.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/prints/**'
      - 'docs/pix-qrcode.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar a página
        run: |
          mkdir -p _site/prints
          cp site/index.html _site/
          cp docs/prints/*.jpg _site/prints/
          cp docs/pix-qrcode.png _site/
          cp Afinador/Assets.xcassets/AppIcon.appiconset/icon-1024.png _site/icon.png
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
