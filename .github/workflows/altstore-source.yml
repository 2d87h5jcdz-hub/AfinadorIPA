name: Fonte AltStore/SideStore

# Gera source.json a partir das Releases e anexa na Release mais recente.
# URL fixa da fonte: https://github.com/<repo>/releases/latest/download/source.json
on:
  workflow_run:
    workflows: ["Gerar IPA"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ["altstore/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Gerar source.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 altstore/build_source.py
      - name: Anexar na Release mais recente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name)
          gh release upload "$latest" altstore/source.json --clobber -R "$GITHUB_REPOSITORY"
          echo "::notice::Fonte publicada: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/source.json (Release $latest)"
